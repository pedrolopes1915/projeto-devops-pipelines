name: Pipeline para automacao do Sistema

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparacao:
    name: '1 - Preparacao'
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Conferir arquivos
        run: |
          test -s index.html
          test -s style.css
          echo 'Arquivos encontrados.'

  validacao:
    name: '2 - Validacao'
    needs: preparacao
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Conferir HTML e vinculo com o CSS
        run: |
          grep -q 'lang="pt-BR"' index.html
          grep -q 'href="style.css"' index.html
          grep -q 'name="viewport"' index.html
          echo 'Estrutura basica validada.'

  testes:
    name: '3 - Testes'
    needs: validacao
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Testar campos e cores configuraveis
        run: |
          grep -q 'id="nome"' index.html
          grep -q 'id="peso"' index.html
          grep -q 'id="valor"' index.html
          grep -q 'id="tipo"' index.html
          grep -q -- '--cor-rodape:' style.css
          grep -q -- '--cor-botao:' style.css
          echo 'Testes basicos passaram.'
      - name: Separar os arquivos do site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p public
          cp index.html style.css public/
      - name: Enviar site para publicacao
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  publicacao:
    name: '4 - Publicacao'
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
