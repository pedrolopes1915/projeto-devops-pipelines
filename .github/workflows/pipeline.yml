
name: Pipeline para automacao do Sistema

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparacao:
    name: '1 - Preparacao'
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      - name: Conferir arquivos
        run: |
          test -s index.html
          test -s style.css
          echo 'Arquivos encontrados.'

  validacao:
    name: '2 - Validacao'
    needs: preparacao
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      - name: Conferir HTML e vinculo com o CSS
        run: |
          grep -q 'lang="pt-BR"' index.html
          grep -q 'href="style.css"' index.html
          grep -q 'name="viewport"' index.html
          echo 'Estrutura basica validada.'

  testes:
    name: '3 - Testes'
    needs: validacao
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      - name: Testar campos e cores configuraveis
        run: |
          grep -q 'id="nome"' index.html
          grep -q 'id="peso"' index.html
          grep -q 'id="valor"' index.html
          grep -q 'id="tipo"' index.html
          grep -q -- '--cor-rodape:' style.css
          grep -q -- '--cor-botao:' style.css
          echo 'Testes basicos passaram.'

      - name: Separar os arquivos do site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p public
          cp index.html style.css public/

          if [ -d imagens ]; then
            cp -r imagens public/
            echo 'Imagens adicionadas ao site.'
          fi

          echo 'Arquivos preparados para publicacao.'
          find public -type f

      - name: Enviar site para publicacao
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  sast:
    name: '4 - SAST (Semgrep)'
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      - name: Testar regras com exemplos seguros e inseguros
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --test --config security/semgrep.yml security/semgrep.html

      - name: Analisar o site e bloquear achados
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config security/semgrep.yml --error --strict \
            --metrics=off --disable-version-check \
            --json-output reports/semgrep.json index.html style.css

      - name: Validar relatorio e cobertura
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/semgrep.json').read_text())
          assert not report.get('errors'), 'Erros na analise SAST'
          assert not report['results'], 'Achados bloqueantes no SAST'
          scanned = report['paths']['scanned']
          assert any(Path(p).name == 'index.html' for p in scanned), 'HTML nao analisado'
          print('SAST aprovado: HTML analisado e nenhum achado bloqueante.')
          PY

      - name: Salvar relatorio SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-sast
          path: reports/semgrep.json
          if-no-files-found: error

  dast:
    name: '5 - DAST (OWASP ZAP)'
    needs: sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      - name: Preparar e iniciar copia temporaria do site
        run: |
          mkdir -p public reports
          cp index.html style.css public/
          if [ -d imagens ]; then cp -r imagens public/; fi
          python3 -m http.server 8080 --bind 0.0.0.0 --directory public > reports/server.log 2>&1 &
          echo $! > reports/server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ -o reports/home.html; then
              cmp index.html reports/home.html
              curl --fail --silent http://127.0.0.1:8080/style.css -o /dev/null
              exit 0
            fi
            sleep 1
          done
          cat reports/server.log
          exit 1

      - name: Executar ZAP Baseline e validar retorno
        run: |
          cp security/zap-rules.tsv reports/zap-rules.tsv
          chmod 777 reports
          set +e
          docker run --rm --network host \
            -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8080/ \
            -c zap-rules.tsv -r zap.html -J zap.json -w zap.md -m 1 -T 5
          status=$?
          set -e
          case "$status" in
            0) echo 'DAST aprovado sem avisos.' ;;
            2) echo 'DAST concluido com avisos nao bloqueantes. Consulte o relatorio.' ;;
            *) echo "DAST reprovado: falha de seguranca ou da ferramenta (codigo $status)."; exit 1 ;;
          esac
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/zap.json').read_text())
          assert report.get('site'), 'ZAP nao retornou nenhum site analisado'
          assert Path('reports/zap.html').stat().st_size > 0, 'Relatorio HTML vazio'
          print('Relatorios DAST validados.')
          PY

      - name: Encerrar servidor temporario
        if: always()
        run: |
          if [ -f reports/server.pid ]; then
            kill "$(cat reports/server.pid)" || true
          fi

      - name: Salvar relatorios DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dast
          path: reports/
          if-no-files-found: error

  publicacao:
    name: '6 - Publicacao'
    needs: dast
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
